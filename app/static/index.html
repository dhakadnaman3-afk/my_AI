<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>AskNaman</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        font-family: 'Segoe UI', Arial, sans-serif;
        background: #343541;
        color: #ececf1;
        height: 100vh;
        display: flex;
    }

    #sidebar {
        width: 260px;
        background: #202123;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #4d4d4f;
    }

    #newChatBtn {
        margin: 12px 12px 6px 12px;
        padding: 10px;
        background: transparent;
        border: 1px solid #565869;
        border-radius: 8px;
        color: #ececf1;
        cursor: pointer;
        font-size: 14px;
        text-align: left;
    }
    #newChatBtn:hover { background: #2a2b32; }

    #searchInput {
        margin: 0 12px 10px 12px;
        padding: 8px 10px;
        background: #2a2b32;
        border: 1px solid #4d4d4f;
        border-radius: 8px;
        color: #ececf1;
        font-size: 13px;
        outline: none;
    }
    #searchInput:focus { border-color: #10a37f; }

    #convList { flex: 1; overflow-y: auto; padding: 0 8px; }

    .conv-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        margin-bottom: 4px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        color: #d1d1d1;
    }
    .conv-item:hover { background: #2a2b32; }
    .conv-item.active { background: #343541; color: #fff; }

    .conv-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        flex: 1;
    }

    .delete-btn {
        opacity: 0;
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 14px;
        padding: 2px 6px;
        border-radius: 4px;
    }
    .conv-item:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { color: #ff4444; background: #3a3a3a; }

    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }

    header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 18px;
        font-weight: 600;
        background: #202123;
        border-bottom: 1px solid #4d4d4f;
        gap: 10px;
    }

    #headerRight { display: flex; align-items: center; gap: 8px; }

    #modelSelect {
        background: #40414f;
        color: #ececf1;
        border: 1px solid #565869;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 13px;
        cursor: pointer;
    }

    #exportBtn {
        background: transparent;
        border: 1px solid #565869;
        color: #ececf1;
        padding: 6px 12px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
    }
    #exportBtn:hover { background: #2a2b32; }

    #chatbox {
        flex: 1;
        overflow-y: auto;
        padding: 20px 10%;
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .row { display: flex; width: 100%; padding: 14px 0; flex-direction: column; }
    .row.user { align-items: flex-end; }
    .row.bot { background: #444654; margin: 0 -10%; padding-left: 10%; padding-right: 10%; align-items: flex-start; }

    .bubble { max-width: 75%; line-height: 1.6; word-wrap: break-word; }
    .row.user .bubble {
        background: #10a37f;
        color: white;
        padding: 10px 14px;
        border-radius: 14px 14px 2px 14px;
        white-space: pre-wrap;
    }
    .row.bot .bubble { color: #ececf1; padding: 4px 0; }
    .row.bot .bubble pre {
        background: #202123;
        padding: 10px;
        border-radius: 6px;
        overflow-x: auto;
    }
    .row.bot .bubble code {
        background: #202123;
        padding: 2px 5px;
        border-radius: 4px;
        font-size: 13px;
    }
    .row.bot .bubble img { max-width: 100%; border-radius: 8px; margin-top: 6px; }

    .regen-btn {
        margin-top: 6px;
        background: transparent;
        border: 1px solid #565869;
        color: #b0b0b0;
        padding: 4px 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
    }
    .regen-btn:hover { background: #2a2b32; color: #fff; }

    #inputArea {
        display: flex;
        gap: 8px;
        padding: 16px 10%;
        background: #343541;
        border-top: 1px solid #4d4d4f;
        align-items: center;
        flex-wrap: wrap;
    }

    #userInput {
        flex: 1;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid #565869;
        background: #40414f;
        color: #ececf1;
        font-size: 15px;
        outline: none;
        min-width: 150px;
    }
    #userInput:focus { border-color: #10a37f; }

    #sendBtn, #micBtn, #imgBtn, #uploadBtn {
        padding: 0 16px;
        height: 44px;
        border: none;
        border-radius: 10px;
        background: #10a37f;
        color: white;
        font-size: 15px;
        cursor: pointer;
    }
    #sendBtn:hover, #micBtn:hover, #imgBtn:hover, #uploadBtn:hover { background: #0e8f6f; }
    #sendBtn:disabled { background: #565869; cursor: not-allowed; }
    #micBtn.recording { background: #ff4444; }
    #imgBtn.active { background: #6c5ce7; }

    #fileChip {
        display: none;
        align-items: center;
        gap: 6px;
        background: #40414f;
        padding: 6px 10px;
        border-radius: 6px;
        font-size: 13px;
    }
    #fileChip button {
        background: none;
        border: none;
        color: #999;
        cursor: pointer;
        font-size: 14px;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #565869; border-radius: 4px; }
</style>
</head>
<body>

<div id="sidebar">
    <button id="newChatBtn" onclick="startNewChat()">+ New Chat</button>
    <input type="text" id="searchInput" placeholder="🔍 Search conversations..." oninput="handleSearch(this.value)" />
    <div id="convList"></div>
</div>

<div id="main">
    <header>
        <span>💬 AskNaman</span>
        <div id="headerRight">
            <select id="modelSelect">
                <option value="smart">Smart (gpt-oss-20b)</option>
                <option value="fast">Fast (llama-3.1-8b)</option>
            </select>
            <button id="exportBtn" onclick="exportChat()">⬇ Export</button>
        </div>
    </header>
    <div id="chatbox"></div>
    <div id="inputArea">
        <button id="imgBtn" title="Toggle image generation mode" onclick="toggleImageMode()">🖼️</button>
        <button id="uploadBtn" title="Attach file" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="file" id="fileInput" accept=".pdf,.txt,.docx,.csv,.json,.jpg,.jpeg,.png" style="display:none" onchange="handleFileUpload(event)" />
        <div id="fileChip">
            <span id="fileChipName"></span>
            <button onclick="clearFile()">✕</button>
        </div>
        <input type="text" id="userInput" placeholder="Message your chatbot..." />
        <button id="micBtn" title="Voice input" onclick="toggleVoice()">🎤</button>
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let sessionId = localStorage.getItem("chatSessionId");
    if (!sessionId) {
        sessionId = "session_" + Math.random().toString(36).substring(7);
        localStorage.setItem("chatSessionId", sessionId);
    }

    let imageMode = false;
    let pendingFileContext = null;
    let pendingFileName = null;
    let lastRegenBtn = null;

    const chatbox = document.getElementById("chatbox");
    const input = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const convList = document.getElementById("convList");
    const imgBtn = document.getElementById("imgBtn");
    const micBtn = document.getElementById("micBtn");
    const modelSelect = document.getElementById("modelSelect");

    function getSelectedModel() {
        return modelSelect.value;
    }

    function addRow(role, text, isMarkdown) {
        const row = document.createElement("div");
        row.className = "row " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        if (isMarkdown) {
            bubble.innerHTML = marked.parse(text);
        } else {
            bubble.textContent = text;
        }
        row.appendChild(bubble);
        chatbox.appendChild(row);
        chatbox.scrollTop = chatbox.scrollHeight;
        return row;
    }

    function addImageRow(role, imageUrl) {
        const row = document.createElement("div");
        row.className = "row " + role;
        const bubble = document.createElement("div");
        bubble.className = "bubble";
        const img = document.createElement("img");
        img.src = imageUrl;
        bubble.appendChild(img);
        row.appendChild(bubble);
        chatbox.appendChild(row);
        chatbox.scrollTop = chatbox.scrollHeight;
    }

    function addRegenerateButton(row) {
        if (lastRegenBtn) lastRegenBtn.remove();
        const btn = document.createElement("button");
        btn.className = "regen-btn";
        btn.textContent = "🔄 Regenerate";
        btn.onclick = regenerateLast;
        row.appendChild(btn);
        lastRegenBtn = btn;
    }

    async function loadHistory() {
        chatbox.innerHTML = "";
        lastRegenBtn = null;
        try {
            const response = await fetch(`/history/${sessionId}`);
            const data = await response.json();
            let lastBotRow = null;
            data.messages.forEach(msg => {
                if (msg.role === "user") {
                    addRow("user", msg.content, false);
                } else {
                    lastBotRow = addRow("bot", msg.content, true);
                }
            });
            if (lastBotRow) addRegenerateButton(lastBotRow);
        } catch (err) {
            console.log("No previous history or error loading it.");
        }
    }

    async function loadConversations(list) {
        convList.innerHTML = "";
        list.forEach(conv => {
            const item = document.createElement("div");
            item.className = "conv-item" + (conv.id === sessionId ? " active" : "");

            const titleSpan = document.createElement("span");
            titleSpan.className = "conv-title";
            titleSpan.textContent = conv.title;
            titleSpan.onclick = () => switchConversation(conv.id);
            titleSpan.ondblclick = (e) => {
                e.stopPropagation();
                startRename(titleSpan, conv.id, conv.title);
            };

            const delBtn = document.createElement("button");
            delBtn.className = "delete-btn";
            delBtn.textContent = "🗑";
            delBtn.onclick = (e) => {
                e.stopPropagation();
                deleteConversation(conv.id);
            };

            item.appendChild(titleSpan);
            item.appendChild(delBtn);
            convList.appendChild(item);
        });
    }

    async function refreshConversations() {
        try {
            const response = await fetch("/conversations");
            const data = await response.json();
            loadConversations(data.conversations);
        } catch (err) {
            console.log("Could not load conversations.");
        }
    }

    let searchTimeout = null;
    function handleSearch(query) {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(async () => {
            if (!query.trim()) {
                refreshConversations();
                return;
            }
            try {
                const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await response.json();
                loadConversations(data.results);
            } catch (err) {
                console.log("Search failed.");
            }
        }, 300);
    }

    function startRename(titleSpan, id, currentTitle) {
        const inputBox = document.createElement("input");
        inputBox.type = "text";
        inputBox.value = currentTitle;
        inputBox.style.width = "100%";
        inputBox.style.background = "#40414f";
        inputBox.style.color = "#ececf1";
        inputBox.style.border = "1px solid #10a37f";
        inputBox.style.borderRadius = "4px";
        inputBox.style.fontSize = "14px";
        inputBox.style.padding = "2px 4px";

        titleSpan.replaceWith(inputBox);
        inputBox.focus();
        inputBox.select();

        async function finishRename() {
            const newTitle = inputBox.value.trim() || currentTitle;
            await fetch(`/conversations/${id}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ title: newTitle })
            });
            refreshConversations();
        }

        inputBox.addEventListener("keypress", (e) => {
            if (e.key === "Enter") finishRename();
        });
        inputBox.addEventListener("blur", finishRename);
    }

    async function deleteConversation(id) {
        if (!confirm("Delete this conversation?")) return;
        await fetch(`/conversations/${id}`, { method: "DELETE" });
        if (id === sessionId) {
            startNewChat();
        } else {
            refreshConversations();
        }
    }

    function switchConversation(id) {
        sessionId = id;
        localStorage.setItem("chatSessionId", sessionId);
        loadHistory();
        refreshConversations();
        clearFile();
    }

    function startNewChat() {
        sessionId = "session_" + Math.random().toString(36).substring(7);
        localStorage.setItem("chatSessionId", sessionId);
        chatbox.innerHTML = "";
        lastRegenBtn = null;
        refreshConversations();
        clearFile();
    }

    window.onload = () => {
        loadHistory();
        refreshConversations();
    };

    function toggleImageMode() {
        imageMode = !imageMode;
        imgBtn.classList.toggle("active", imageMode);
        input.placeholder = imageMode ? "Describe the image you want..." : "Message your chatbot...";
    }

    // ---- FILE UPLOAD ----
    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const formData = new FormData();
        formData.append("file", file);

        try {
            const response = await fetch("/upload", { method: "POST", body: formData });
            const data = await response.json();

            if (data.error) {
                alert(data.error);
                return;
            }

            pendingFileContext = data.text;
            pendingFileName = data.filename;

            document.getElementById("fileChipName").textContent = "📄 " + pendingFileName;
            document.getElementById("fileChip").style.display = "flex";
        } catch (err) {
            alert("Failed to upload file.");
        }

        event.target.value = "";
    }

    function clearFile() {
        pendingFileContext = null;
        pendingFileName = null;
        document.getElementById("fileChip").style.display = "none";
    }

    // ---- EXPORT CHAT ----
    function exportChat() {
        const rows = chatbox.querySelectorAll(".row");
        let text = "";
        rows.forEach(row => {
            const role = row.classList.contains("user") ? "You" : "Bot";
            const bubble = row.querySelector(".bubble");
            if (bubble) text += `${role}: ${bubble.textContent}\n\n`;
        });

        if (!text.trim()) {
            alert("No conversation to export.");
            return;
        }

        const blob = new Blob([text], { type: "text/plain" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "chat_export.txt";
        a.click();
        URL.revokeObjectURL(url);
    }

    // ---- SEND MESSAGE ----
    async function sendMessage() {
        const message = input.value.trim();
        if (!message) return;

        addRow("user", message, false);
        input.value = "";
        sendBtn.disabled = true;

        if (imageMode) {
            const loadingRow = addRow("bot", "Generating image...", false);
            try {
                const response = await fetch("/generate-image", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ session_id: sessionId, message: message })
                });
                const data = await response.json();
                loadingRow.remove();
                addImageRow("bot", data.image_url);
            } catch (err) {
                loadingRow.querySelector(".bubble").textContent = "Error generating image.";
            }
            sendBtn.disabled = false;
            refreshConversations();
            return;
        }

        const botRow = addRow("bot", "", false);
        const outputBubble = botRow.querySelector(".bubble");
        let fullText = "";

        try {
            const response = await fetch("/chat-stream", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    session_id: sessionId,
                    message: message,
                    file_context: pendingFileContext,
                    model: getSelectedModel()
                })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                fullText += chunk;
                outputBubble.textContent = fullText;
                chatbox.scrollTop = chatbox.scrollHeight;
            }

            outputBubble.innerHTML = marked.parse(fullText);
            addRegenerateButton(botRow);
        } catch (err) {
            outputBubble.textContent = "Error: could not reach the server.";
        }

        sendBtn.disabled = false;
        refreshConversations();
        clearFile();
    }

    // ---- REGENERATE ----
    async function regenerateLast() {
        if (lastRegenBtn) lastRegenBtn.remove();

        const rows = chatbox.querySelectorAll(".row.bot");
        const lastBotRow = rows[rows.length - 1];
        if (lastBotRow) lastBotRow.remove();

        const botRow = addRow("bot", "", false);
        const outputBubble = botRow.querySelector(".bubble");
        let fullText = "";

        try {
            const response = await fetch("/regenerate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ session_id: sessionId, model: getSelectedModel() })
            });

            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                const chunk = decoder.decode(value);
                fullText += chunk;
                outputBubble.textContent = fullText;
                chatbox.scrollTop = chatbox.scrollHeight;
            }

            outputBubble.innerHTML = marked.parse(fullText);
            addRegenerateButton(botRow);
        } catch (err) {
            outputBubble.textContent = "Error regenerating response.";
        }
    }

    input.addEventListener("keypress", function (e) {
        if (e.key === "Enter") sendMessage();
    });

    // ---- VOICE INPUT ----
    let recognition = null;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = false;
        recognition.interimResults = false;
        recognition.lang = "en-IN";

        recognition.onresult = (event) => {
            const transcript = event.results[0][0].transcript;
            input.value = transcript;
        };

        recognition.onend = () => {
            isRecording = false;
            micBtn.classList.remove("recording");
        };
    }

    function toggleVoice() {
        if (!recognition) {
            alert("Voice input not supported in this browser. Try Chrome.");
            return;
        }
        if (isRecording) {
            recognition.stop();
            isRecording = false;
            micBtn.classList.remove("recording");
        } else {
            recognition.start();
            isRecording = true;
            micBtn.classList.add("recording");
        }
    }
</script>

</body>
</html>
